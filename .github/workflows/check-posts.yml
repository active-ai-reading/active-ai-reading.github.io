name: Check posts

# Separate from the deploy, so one post's header never holds back everyone else's.
on:
  push:
    branches: [main]
    paths: ["_posts/**", "_papers/**", "_data/roles.yml", "bin/check_posts.py"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip3 install pyyaml && python3 bin/check_posts.py
