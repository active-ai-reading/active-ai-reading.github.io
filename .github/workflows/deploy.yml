name: Deploy site

# Rebuilds and publishes the site on every push to main.
# If a build fails, the live site keeps serving the last good version.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "templates/**"
  workflow_dispatch: # lets you rerun it by hand from the Actions tab

permissions:
  contents: write # needed to push the built site to the gh-pages branch
  issues: write # to report a broken build in an issue (see the last two steps)

# With many people pushing, only the newest build matters: cancel older ones.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Draw social-media cards for posts and papers 🖼️
        run: |
          pip3 install pillow pyyaml
          python3 bin/og/make_cards.py
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          set -o pipefail
          bundle exec jekyll build 2>&1 | tee build.log
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

      # Tell whoever pushed when their change broke the build, in one issue everyone can see.
      - name: Report a broken build 🚨
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          TITLE="Site build is broken"
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          ERR=$(grep -E "Liquid Exception|Conversion error|ERROR" build.log 2>/dev/null | grep -vi imagemagick | head -1 | sed 's/\x1b\[[0-9;]*m//g' | sed "s#$GITHUB_WORKSPACE/##g" | sed 's/^ *//')
          {
            echo "@$ACTOR the site did not rebuild after [this change]($REPO_URL/commit/$GITHUB_SHA). The live site still shows the previous version."
            echo
            echo '**Error:**'
            echo '```'
            echo "${ERR:-(see the full log)}"
            echo '```'
            echo "Usually it is a \`{% ... %}\` tag: a misspelled file name in an include, or a tag that is never closed."
            echo "[Full log]($REPO_URL/actions/runs/$GITHUB_RUN_ID). Fix the file and save again; this issue closes itself once the site builds."
          } > body.md
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file body.md; else gh issue create --title "$TITLE" --body-file body.md; fi

      - name: Close the broken-build issue ✅
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search '"Site build is broken" in:title' --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue close "$NUM" --comment "Fixed: the site builds again (${GITHUB_SHA:0:7})."; fi
