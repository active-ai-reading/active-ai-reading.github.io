<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img">
<title>Matryoshka language model suites</title>
<desc>(a) Three separately trained models versus one nested model whose prefixes are the smaller models. (b) Architecture drawn to scale: three blocks of increasing width, each ending in an exit with its own LM head; the largest exit distills into the smaller ones. (c) The junction rescales the old stream and appends fresh embedding channels. (d) Which blocks each exit's loss updates. (e) Training compute and speculative-decoding throughput.</desc>
