<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
<title>Matryoshka language model suites</title>
<desc>(a) Three separate training runs versus one run that yields a nested model. (b) Architecture drawn to scale: a sentence with a blank enters three blocks of increasing width, each ending in an output head that fills the blank as a distribution over five words; the largest model's distribution (graduation cap) is the teacher, its shape is handed to the two smaller models, which are trained to match it. (c) At each junction the large old stream is rescaled to the norm of a fresh embedding and the two are concatenated.</desc>
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#2E3640}
  .pl{font-size:22px;font-weight:700;fill:#1B2430}
  .lb{font-size:15px}
  .sm{font-size:14px;fill:#4A5563}
  .mu{font-size:15px;fill:#5A6470}
  .mt{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:17px;fill:#2E3640}
  .wh{fill:#fff;font-size:15px;font-weight:600}
  .dk{fill:#0E2A52;font-size:15px;font-weight:600}
</style>
<defs>
  <linearGradient id="gB1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6E7F8"/><stop offset="1" stop-color="#A3C7EA"/></linearGradient>
  <linearGradient id="gB2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A2C5EC"/><stop offset="1" stop-color="#6199D4"/></linearGradient>
  <linearGradient id="gB3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F80C3"/><stop offset="1" stop-color="#264F8E"/></linearGradient>
  <linearGradient id="gOr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8C285"/><stop offset="1" stop-color="#E58A30"/></linearGradient>
  <linearGradient id="gGr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F3F6"/><stop offset="1" stop-color="#D9DEE4"/></linearGradient>
  <filter id="sh" x="-8%" y="-15%" width="116%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1B2A41" flood-opacity="0.18"/></filter>
  <pattern id="p1" x="120" y="268" width="11" height="56" patternUnits="userSpaceOnUse"><rect width="9" height="56" rx="2.5" fill="url(#gB1)"/></pattern>
  <pattern id="p2" x="406" y="268" width="11" height="127" patternUnits="userSpaceOnUse"><rect width="9" height="127" rx="2.5" fill="url(#gB2)"/></pattern>
  <pattern id="p3" x="538" y="268" width="11" height="239" patternUnits="userSpaceOnUse"><rect width="9" height="239" rx="2.5" fill="url(#gB3)"/></pattern>
  <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5z" fill="#4A5563"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5z" fill="#E58A30"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1.5 1.5L8.5 5L1.5 8.5z" fill="#E58A30"/></marker>
  <g id="badge">
    <rect x="-22" y="-14" width="44" height="28" rx="8" fill="#fff" stroke="#E58A30" stroke-width="1.4"/>
    <g fill="#E58A30"><rect x="-16" y="-7" width="5" height="16" rx="1.5"/><rect x="-9" y="2" width="5" height="7" rx="1.2"/><rect x="-2" y="5" width="5" height="4" rx="1"/><rect x="5" y="6.2" width="5" height="2.8" rx="0.9"/><rect x="12" y="7.2" width="5" height="1.8" rx="0.7"/></g>
  </g>
</defs>
<rect width="1280" height="720" fill="#fff"/>

<!-- (a) original -->
<text class="pl" x="40" y="44">(a)</text>
<text class="mu" x="88" y="85" text-anchor="end">3 runs</text>
<rect x="100" y="60" width="80" height="40" rx="20" fill="url(#gGr)" stroke="#B8C0CA" stroke-width=".8" filter="url(#sh)"/><text class="lb" x="140" y="80" text-anchor="middle" dominant-baseline="central">500M</text>
<rect x="196" y="60" width="242" height="40" rx="20" fill="url(#gGr)" stroke="#B8C0CA" stroke-width=".8" filter="url(#sh)"/><text class="lb" x="317" y="80" text-anchor="middle" dominant-baseline="central">1.5B</text>
<rect x="454" y="60" width="510" height="40" rx="20" fill="url(#gGr)" stroke="#B8C0CA" stroke-width=".8" filter="url(#sh)"/><text class="lb" x="709" y="80" text-anchor="middle" dominant-baseline="central">3B</text>
<text class="mu" x="88" y="153" text-anchor="end">1 run</text>
