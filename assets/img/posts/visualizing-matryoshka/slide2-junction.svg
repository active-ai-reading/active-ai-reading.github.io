<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">The junction mechanism</title>
<desc id="desc">The 500M model output and a fresh embedding from the same tokens enter a large junction. Inside it, the previous output is rescaled so its norm matches the new embedding, then the two channel groups are concatenated. A 2304-channel output vector leaves the junction and flows to the next Transformer stage.</desc>
<defs>
  <marker id="arrow-ink" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5 1 L7 4 L0.5 7" fill="none" stroke="#202830" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-muted" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5 1 L7 4 L0.5 7" fill="none" stroke="#626c74" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-old" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5 1 L7 4 L0.5 7" fill="none" stroke="#d59742" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-new" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5 1 L7 4 L0.5 7" fill="none" stroke="#c67543" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5 1 L7 4 L0.5 7" fill="none" stroke="#40836b" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1920" height="1080" fill="#fff"/>
<g font-family="STIX Two Text, Times New Roman, serif">

<text x="86" y="111" fill="#202830" font-size="58" font-weight="600" text-anchor="start">The junction mechanism</text>
<path d="M86 143 L1834 143" fill="none" stroke="#cbd1d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="211" fill="#626c74" font-size="29" font-weight="400" text-anchor="start">500M</text>
<path d="M190 202 L245 202" fill="none" stroke="#626c74" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
<text x="265" y="211" fill="#626c74" font-size="29" font-weight="400" text-anchor="start">1.5B example</text>
<text x="151" y="574" fill="#202830" font-size="39" font-weight="400" text-anchor="middle" font-style="italic">x</text>
<text x="151" y="618" fill="#626c74" font-size="21" font-weight="400" text-anchor="middle">input tokens</text>
<path d="M182 560 L244 560" fill="none" stroke="#202830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<path d="M246 430 L246 730" fill="none" stroke="#202830" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="246" cy="430" r="3.5" fill="#202830"/>
<path d="M251 430 L282 430" fill="none" stroke="#202830" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
<circle cx="246" cy="730" r="3.5" fill="#202830"/>
<path d="M251 730 L282 730" fill="none" stroke="#202830" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/>
