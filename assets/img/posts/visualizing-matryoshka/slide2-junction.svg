<text x="780" y="454" fill="#d59742" font-size="31" font-weight="400" text-anchor="middle" font-style="italic">o₁(x)</text>
<text x="780" y="522" fill="#626c74" font-size="23" font-weight="400" text-anchor="middle">1024 channels</text>
<rect x="670" y="657" width="220" height="103" rx="4" fill="#fff8f3" stroke="#c67543" stroke-width="2"/>
<text x="780" y="720" fill="#c67543" font-size="31" font-weight="400" text-anchor="middle" font-style="italic">e₂(x)</text>
<text x="780" y="798" fill="#626c74" font-size="23" font-weight="400" text-anchor="middle">1280 fresh channels</text>
<text x="1050" y="420" fill="#40836b" font-size="25" font-weight="400" text-anchor="middle">match norms</text>
<path d="M985 463 L1025 463" fill="none" stroke="#40836b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1115 463 L1075 463" fill="none" stroke="#40836b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="1050" y="509" fill="#40836b" font-size="21" font-weight="400" text-anchor="middle" font-style="italic">||õ₁||₂ = ||e₂(x)||₂</text>
<circle cx="1050" cy="594" r="23" fill="none" stroke="#40836b" stroke-width="2.5"/>
<path d="M1037.35 594 L1062.65 594" fill="none" stroke="#40836b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1050 581.35 L1050 606.65" fill="none" stroke="#40836b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1050" y="641" fill="#40836b" font-size="21" font-weight="400" text-anchor="middle">concatenate</text>
<path d="M1125 565 L1230 565" fill="none" stroke="#40836b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="1245" y="435" width="220" height="82" rx="4" fill="#fffaf2" stroke="#d59742" stroke-width="2"/>
<rect x="1245" y="517" width="220" height="103" rx="4" fill="#fff8f3" stroke="#c67543" stroke-width="2"/>
<text x="1355" y="487" fill="#d59742" font-size="29" font-weight="400" text-anchor="middle" font-style="italic">õ₁(x)</text>
<text x="1355" y="580" fill="#c67543" font-size="29" font-weight="400" text-anchor="middle" font-style="italic">e₂(x)</text>
<path d="M1471 525 L1575 525" fill="none" stroke="#40836b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="1710" y="441" fill="#202830" font-size="31" font-weight="600" text-anchor="middle" font-style="italic">o′₁</text>
<text x="1710" y="474" fill="#626c74" font-size="22" font-weight="400" text-anchor="middle">2304 channels</text>
<rect x="1590" y="495" width="106" height="72" rx="4" fill="#fffaf2" stroke="#d59742" stroke-width="2"/>
<rect x="1696" y="495" width="134" height="72" rx="4" fill="#fff8f3" stroke="#c67543" stroke-width="2"/>
<text x="1643" y="542" fill="#d59742" font-size="20" font-weight="400" text-anchor="middle">1024</text>
<text x="1763" y="542" fill="#c67543" font-size="20" font-weight="400" text-anchor="middle">1280</text>
<path d="M1710 573 L1710 740" fill="none" stroke="#40836b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="1595" y="752" width="230" height="144" rx="4" fill="#fff8f3" stroke="#c67543" stroke-width="2"/>
<text x="1710" y="813" fill="#c67543" font-size="41" font-weight="600" text-anchor="middle" font-style="italic">T₂</text>
<text x="1710" y="857" fill="#202830" font-size="22" font-weight="600" text-anchor="middle">+0.98B stage</text>
<text x="1710" y="938" fill="#626c74" font-size="24" font-weight="400" text-anchor="middle">1.5B exit</text>
</g></svg>
