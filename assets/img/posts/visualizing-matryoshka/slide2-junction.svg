<text x="405" y="421" fill="#d59742" font-size="40" font-weight="600" text-anchor="middle" font-style="italic">T₁</text>
<text x="405" y="466" fill="#202830" font-size="24" font-weight="600" text-anchor="middle">500M sub-model</text>
