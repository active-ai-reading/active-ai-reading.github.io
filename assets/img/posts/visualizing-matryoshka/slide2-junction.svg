<text x="405" y="724" fill="#c67543" font-size="37" font-weight="600" text-anchor="middle" font-style="italic">E₂</text>
<text x="405" y="758" fill="#626c74" font-size="23" font-weight="400" text-anchor="middle">fresh embedding</text>
<ellipse cx="1050" cy="580" rx="480" ry="360" fill="#f3faf6" stroke="#40836b" stroke-width="2.4"/>
<path d="M526 430 L612 430" fill="none" stroke="#d59742" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-old)"/>
<path d="M526 730 L612 730" fill="none" stroke="#c67543" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="1050" y="345" fill="#40836b" font-size="45" font-weight="600" text-anchor="middle" font-style="italic">J</text>
