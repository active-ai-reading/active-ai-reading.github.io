  .heading { font-size: 25px; font-weight: 550; letter-spacing: -.6px; }
  .section { font-size: 12px; fill: #68775f; text-anchor: middle; }
  .label { font-size: 14px; text-anchor: middle; }
  .shape { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: 10px; fill: #617456; text-anchor: middle; }
  .wire-shape { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #526b45; text-anchor: middle; }
  .position { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: 9px; fill: #8e9b84; text-anchor: middle; }
  .token-d { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: 11px; text-anchor: middle; }
  .key { font-size: 12px; fill: #67785c; }
  .edge { fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
</style>
