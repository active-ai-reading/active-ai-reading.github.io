<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="1240" height="730" role="img" aria-labelledby="title description">
<title id="title">MSAR at token t</title>
<desc id="description">Read left to right. For each depth source i, identity uses token t; causal convolutions use tokens t−3 through t, t−7 through t, or t−11 through t. Every token vector has d features. Future tokens are excluded. Repeat independently for all N sources. Each stream retrieves one d-dimensional vector by attending over N depth sources at the fixed token t. Learned channel-wise convolution weights mix the token positions. Ellipses abbreviate the input windows. Fusion produces the d-dimensional MSAR output at token t, which is the next residual branch input.</desc>
