<script>
  const figure = document.getElementById("slide1-architecture");
  const groups = [...figure.querySelectorAll("[data-flow]")];
  const buttons = [...document.querySelectorAll("button[data-choice]")];
  const status = document.getElementById("flow-status");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let pending = [];
  let selected = "all";

  function showFlow(choice) {
    pending.forEach(clearTimeout);
    pending = [];
    selected = choice;
    buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.choice === choice)));
    if (choice === "all") {
      groups.forEach(group => { group.style.opacity = "1"; });
      status.textContent = "All model flows shown.";
      return;
    }
    groups.forEach(group => { group.style.opacity = "0.16"; });
    groups.filter(group => group.dataset.flow.split(" ").includes(choice)).forEach(group => {
      const delay = reducedMotion.matches ? 0 : 35 + Number(group.dataset.order) * 115;
      pending.push(setTimeout(() => {
        if (selected === choice) group.style.opacity = "1";
      }, delay));
    });
    status.textContent = choice + " flow selected. Shared stages and the matching independent model are highlighted.";
  }

  buttons.forEach(button => button.addEventListener("click", () => showFlow(button.dataset.choice)));
</script>
